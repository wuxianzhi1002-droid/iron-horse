server {
    listen 80;
    server_name wuxianzhi.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep HTTP-01 renewal available, and redirect all application traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wuxianzhi.asia;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/wuxianzhi.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuxianzhi.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
